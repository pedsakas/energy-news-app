  function interpolate(str, scope) {

      var v = lookup(path, scope);
      return v === undefined || v === null ? '' : String(v);
    });
  }

  function truthy(v) {
    return Array.isArray(v) ? v.length > 0 : !!v;
  }

  /* Parsing the template is what makes the console noisy. The moment the parser
     builds <path d="{{ chart.gridPath }}">, SVG tries to read that as a path,
     fails, and logs — once per attribute, before any of our code has looked at
     it. The values are of course replaced a moment later, so the page is
     correct and the log is pure noise; but 77 lines of it on a page load is not
     something to leave lying around.

     So any attribute whose value still holds a {{ … }} is renamed to a data-*
     attribute before the markup is parsed. Nothing validates data-*. The
     original name is restored in renderNode, which is the only thing that reads
     these attributes anyway. */
  var HOLE_ATTR = /(\s)((?!data-hole-)[a-zA-Z_:][-\w:.]*)(\s*=\s*(?:"[^"]*\{\{[^"]*"|'[^']*\{\{[^']*'))/g;

  function shield(html) {
    return html.replace(HOLE_ATTR, function (_, ws, name, rest) {
      return ws + 'data-hole-' + name + rest;
    });
  }

  var SHIELD_PREFIX = 'data-hole-';

  /* Read an attribute that may have been shielded on the way in. */
  function attrOf(node, name) {
    return node.getAttribute(name) || node.getAttribute(SHIELD_PREFIX + name) || '';
  }

  /* --- rendering ---------------------------------------------------------- */

  function renderNodes(sourceNodes, scope, out) {
    for (var i = 0; i < sourceNodes.length; i++) renderNode(sourceNodes[i], scope, out);
  }

  function renderNode(node, scope, out) {
    if (node.nodeType === 3) {                       // text
      var text = node.nodeValue;
      out.appendChild(document.createTextNode(
        HOLE.test(text) ? (HOLE.lastIndex = 0, interpolate(text, scope)) : text
      ));
      HOLE.lastIndex = 0;
      return;
    }
    if (node.nodeType === 8) return;                 // comment — drop
    if (node.nodeType !== 1) return;

    var tag = node.tagName.toLowerCase();

    if (tag === 'sc-for') {
      var listAttr = attrOf(node, 'list');
      var m = listAttr.match(WHOLE_HOLE);
      var list = m ? lookup(m[1], scope) : [];
      var as = attrOf(node, 'as') || 'item';
      if (!Array.isArray(list)) list = [];
      for (var j = 0; j < list.length; j++) {
        var child = Object.create(scope);
        child[as] = list[j];
        child.$index = j;
        renderNodes(node.childNodes, child, out);
      }
      return;
    }

    if (tag === 'sc-if') {
      var valAttr = attrOf(node, 'value');
      var vm = valAttr.match(WHOLE_HOLE);
      var val = vm ? lookup(vm[1], scope) : valAttr;
      if (truthy(val)) renderNodes(node.childNodes, scope, out);
      return;
    }

    if (tag === 'dc-import') {
      var name = attrOf(node, 'name') || 'component';
      var note = document.createElement('div');
      note.setAttribute('style',
        'padding:12px;border:1px dashed rgba(246,243,238,.28);border-radius:3px;' +
        'font:12px ui-monospace,monospace;color:#97918a');
      note.textContent = '<dc-import name="' + name + '"> renders on the canvas, not in this standalone preview';
      out.appendChild(note);
      return;
    }

    var el = node.namespaceURI === SVG_NS
      ? document.createElementNS(SVG_NS, node.tagName)
      : document.createElement(tag);

    for (var a = 0; a < node.attributes.length; a++) {
      var attr = node.attributes[a];
      var an = attr.name, av = attr.value;
      if (an.indexOf(SHIELD_PREFIX) === 0) an = an.slice(SHIELD_PREFIX.length);
      if (an.indexOf('hint-') === 0) continue;

      var whole = av.match(WHOLE_HOLE);

      if (/^on[a-z]/.test(an)) {
        var fn = whole ? lookup(whole[1], scope) : null;
        if (typeof fn === 'function') el.addEventListener(an.slice(2).toLowerCase(), fn);
        continue;
      }

      if (whole) {
        var raw = lookup(whole[1], scope);
        if (raw === undefined || raw === null || raw === false) continue;
        el.setAttribute(an, raw === true ? '' : String(raw));
      } else {
        el.setAttribute(an, interpolate(av, scope));
      }
    }

    renderNodes(node.childNodes, scope, el);
    out.appendChild(el);
  }

  /* Render a node's children into a detached fragment (used for the root). */
  function renderElement(node, scope) {
    var frag = document.createDocumentFragment();
    renderNodes(node.childNodes, scope, frag);
    return frag;
  }

  /* --- boot --------------------------------------------------------------- */

  function readProps(scriptEl) {
    var defaults = {};
    var raw = scriptEl && scriptEl.getAttribute('data-props');
    if (!raw) return defaults;
    var spec;
    try { spec = JSON.parse(raw); } catch (e) {
      console.warn('[support.js] data-props is not valid JSON:', e.message);
      return defaults;
    }
    for (var k in spec) {
      if (k === '$preview') continue;
      if (spec[k] && typeof spec[k] === 'object' && 'default' in spec[k]) defaults[k] = spec[k]['default'];
    }
    // The canvas supplies prop values through its tweak chips. Standalone, they
    // come from app.config.json, injected by tools/build-preview.mjs.
    var override = global.ED_PROPS;
    if (override && typeof override === 'object') {
      for (var o in override) if (Object.prototype.hasOwnProperty.call(override, o)) defaults[o] = override[o];
    }
    return defaults;
  }

  function boot() {
    var root = document.querySelector('x-dc');
    if (!root) return;

    /* The static build parks the markup as raw text and hoists the helmet into
       the head itself. Raw text is the point: an inert template still builds
       SVG elements, and an SVG element parses "{{ chart.gridPath }}" as a path
       the moment the attribute is set, fails, and logs it — before any of this
       has run. Text is never parsed until we hand it over below. Hoisting the
       styles also stops them applying a frame late. On the canvas, and when the
       .dc.html is opened straight from disk, nothing is parked and the markup
       sits inside the x-dc element as authored. */
    var parked = document.getElementById('ed-artboard-src');
    var sourceHtml = parked ? (parked.textContent || parked.innerHTML) : root.innerHTML;

    var template = document.createElement('template');
    template.content.appendChild(document.createRange().createContextualFragment(shield(sourceHtml)));

    var helmet = template.content.querySelector('helmet');
    if (helmet) {
      while (helmet.firstChild) document.head.appendChild(helmet.firstChild);
      helmet.parentNode.removeChild(helmet);
    }

    var scriptEl = document.querySelector('script[data-dc-script]');
    var Comp = null;
    if (scriptEl && scriptEl.textContent.trim()) {
      try {
        Comp = new Function('DCLogic', scriptEl.textContent + '\n;return Component;')(DCLogic);
      } catch (e) {
        console.error('[support.js] component script failed:', e);
      }
    }

    var instance = Comp ? new Comp(readProps(scriptEl)) : new DCLogic(readProps(scriptEl));

    function draw() {
      var vals = instance.renderVals() || {};
      var scope = Object.create(vals);
      scope.props = instance.props;
      scope.state = instance.state;
      root.innerHTML = '';
      root.appendChild(renderElement(template.content, scope));
    }

    instance.__rerender = draw;
    draw();
    if (typeof instance.componentDidMount === 'function') instance.componentDidMount();

    global.__ED_COMPONENT__ = instance;
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis, document);
</script>
</head>
<body>
<x-dc></x-dc>
<script type="text/plain" id="ed-artboard-src">
<div class="ed-root ed-root--{{density}}" style="--accent: {{accent}}">

  <!-- ===================================================================
       Market rail. Values come from SAMPLE_RAIL in the logic block below.
       Point liveDataUrl at the live data app and the chip flips to LIVE;
       swap SAMPLE_RAIL for a fetch in componentDidMount to wire it for real.
       =================================================================== -->
  <sc-if value="{{showMarketRail}}" hint-placeholder-val="{{true}}">
  <div style="background: #0d0b09; border-bottom: 1px solid rgba(246,243,238,0.14)">
    <div class="ed-wrap" style="display: flex; align-items: center; gap: 20px; min-height: 46px">
      <span class="ed-chip {{feed.chipClass}}">{{feed.label}}</span>
      <div class="ed-rail-list" style="display: flex; align-items: center; gap: 28px; flex-grow: 1">
        <sc-for list="{{rail}}" as="row" hint-placeholder-count="7">
          <div style="display: flex; align-items: baseline; gap: 8px; white-space: nowrap">
            <span style="font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: #97918a">{{row.code}}</span>
            <span class="ed-num" style="font-size: 13px; color: #f6f3ee">{{row.value}}</span>
            <span class="ed-num" style="font-size: 11px; color: {{row.color}}">{{row.change}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
  </sc-if>

  <!-- ===== Masthead ==================================================== -->
  <header class="ed-wrap ed-masthead" style="display: flex; align-items: center; justify-content: space-between; gap: 32px; padding-block: 26px">
    <a class="ed-story-link" href="#top" style="display: flex; align-items: baseline; gap: 14px">
      <!-- Slot: masthead-logo. Optional — remove this wordmark if you fill it. -->
      <span style="font-family: var(--display); font-size: 27px; font-weight: 600; letter-spacing: -0.02em; color: #f6f3ee">{{brandName}}</span>
      <span style="font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #6d6861">Nordics&nbsp;&amp;&nbsp;Baltics</span>
    </a>
    <nav class="ed-nav" style="display: flex; align-items: center; gap: 26px">
      <a class="ed-navlink" href="#analysis">Analysis</a>
      <a class="ed-navlink" href="#markets">Markets</a>
      <a class="ed-navlink" href="#reports">Reports</a>
      <a class="ed-cta ed-cta--ghost" style="min-height: 40px; padding: 0 16px; font-size: 14px" href="#subscribe">Subscribe</a>
    </nav>
  </header>
  <hr class="ed-hairline">

  <!-- ===================================================================
       Hero. Left is the lead analysis, right is the primary conversion.
       The signup sits above the fold on purpose: the newsletter is the
       product the page is actually selling.
       =================================================================== -->
  <section class="ed-wrap" style="padding-block: 52px 0" id="analysis">
    <div class="ed-hero-grid" style="display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 52px; align-items: start">

      <div style="display: flex; flex-direction: column; gap: 20px">
        <p class="ed-kicker">{{lead.kicker}}</p>
        <a class="ed-story-link" href="{{lead.href}}">
          <h1>{{lead.title}}</h1>
        </a>
        <p style="font-family: var(--display); font-size: 20px; line-height: 1.45; color: #cfc8bf; max-width: 50ch">{{lead.dek}}</p>
        <p style="font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6d6861">
          {{lead.byline}} &middot; {{lead.dateLabel}} &middot; {{lead.readingTime}}
        </p>

        <div style="display: flex; flex-direction: column">
          <figure class="ed-slot ed-slot--empty" data-slot="finland-photo" data-kind="photo" data-ratio="16/9" data-min-width="2000" style="aspect-ratio: 16 / 9">
            <span style="color: #97918a">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5h4l1.4-2h7.2L17 5.5h4v13H3z"></path><circle cx="12" cy="12" r="3.6"></circle></svg>
            </span>
            <span class="ed-slot__id">finland-photo</span>
            <span class="ed-slot__spec">photo &middot; 16:9 &middot; 2000px min</span>
          </figure>
          <figcaption class="ed-slot__caption">[PHOTO CAPTION] &middot; [CREDIT]</figcaption>
        </div>

        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding-top: 4px">
          <a class="ed-cta" href="{{lead.href}}">
            Read the analysis
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M12.5 6l6 6-6 6"></path></svg>
          </a>
          <a class="ed-cta ed-cta--ghost" href="#markets">See the numbers</a>
        </div>
      </div>

      <!-- Primary conversion ------------------------------------------- -->
      <aside class="ed-signup" id="subscribe">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <p class="ed-kicker">{{nl.name}}</p>
          <h2 style="font-size: 27px">{{nl.headline}}</h2>
          <p style="font-size: 15px; line-height: 1.55; color: #a9a29a">{{nl.promise}}</p>
        </div>

        <ul class="ed-ticks">
          <sc-for list="{{nl.bullets}}" as="b" hint-placeholder-count="4">
            <li>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
              <span>{{b}}</span>
            </li>
          </sc-for>
        </ul>

        <sc-if value="{{nl.wired}}">
          <form class="ed-signup__row" action="{{nl.action}}" method="{{nl.method}}" target="_blank" rel="noopener">
            <label class="ed-vh" for="ed-email-hero">Email address</label>
            <input class="ed-input" id="ed-email-hero" type="email" name="{{nl.field}}" placeholder="you@company.com" autocomplete="email" required>
            <button class="ed-cta" type="submit">{{nl.submitLabel}}</button>
          </form>
        </sc-if>
        <sc-if value="{{nl.unwired}}">
          <div class="ed-signup__row" aria-hidden="true">
            <span class="ed-input ed-input--dead">you@company.com</span>
            <span class="ed-cta ed-cta--dead">{{nl.submitLabel}}</span>
          </div>
          <p class="ed-warn">{{nl.warning}}</p>
        </sc-if>

        <p style="font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; color: #6d6861">
          {{nl.cadence}} &middot; {{nl.reassurance}}
        </p>
      </aside>

    </div>
  </section>

  <!-- ===== Second feature ============================================== -->
  <section class="ed-wrap" style="padding-block: 72px 0" id="renewables">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 20px; padding-bottom: 20px">
      <h2 style="font-size: 24px">Also on the desk</h2>
      <a href="#reports" style="font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase">Research catalogue</a>
    </div>
    <hr class="ed-hairline">

    <div class="ed-feature-grid" style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 44px; align-items: center; padding-top: 34px">
      <figure class="ed-slot ed-slot--empty" data-slot="lithuania-chart" data-kind="chart" data-ratio="4/3" data-min-width="1400" style="aspect-ratio: 4 / 3">
        <span style="color: #00c7a6">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V9.5M10 20V4.5M16 20v-7M22 20H2"></path></svg>
        </span>
        <span class="ed-slot__id">lithuania-chart</span>
        <span class="ed-slot__spec">chart &middot; 4:3 &middot; 1400px min</span>
      </figure>

      <article style="display: flex; flex-direction: column; gap: 16px">
        <p class="ed-kicker">{{second.kicker}}</p>
        <a class="ed-story-link" href="{{second.href}}"><h2>{{second.title}}</h2></a>
        <p style="font-size: 16px; line-height: 1.6; color: #a9a29a; max-width: 56ch">{{second.dek}}</p>
        <p style="font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6d6861">
          {{second.byline}} &middot; {{second.dateLabel}} &middot; {{second.readingTime}}
        </p>
        <div style="padding-top: 4px">
          <a class="ed-cta ed-cta--ghost" href="{{second.href}}">
            Read the analysis
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M12.5 6l6 6-6 6"></path></svg>
          </a>
        </div>
      </article>
    </div>
  </section>

  <!-- ===================================================================
       Data panels. Both slots ship with a drawn sample so the layout reads
       before any asset exists. Filling the slot in assets/manifest.json
       replaces the drawing — with a file, a pasted SVG, or a live embed URL
       from the data app.
       =================================================================== -->
  <section class="ed-wrap" style="padding-block: 80px 0" id="markets">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 20px; padding-bottom: 20px">
      <h2 style="font-size: 24px">The numbers behind the story</h2>
      <span class="ed-chip {{feed.chipClass}}">{{feed.label}}</span>
    </div>
    <hr class="ed-hairline">

    <div class="ed-data-grid" style="display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 32px; padding-top: 32px">

      <!-- Panel: day-ahead power ---------------------------------------- -->
      <div class="ed-panel" style="display: flex; flex-direction: column; gap: 16px; padding: 24px; background: #0d0b09; border: 1px solid rgba(246,243,238,0.14); border-radius: 3px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h3 style="font-size: 18px">Day-ahead power, 30 days</h3>
            <p style="font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: #6d6861">&euro;/MWh &middot; baseload &middot; FI, SE3, LT</p>
          </div>
        </div>

        <div class="ed-chart-scroll">
        <figure class="ed-slot" data-slot="prices-chart" data-kind="chart" data-ratio="16/9" data-min-width="1800" style="aspect-ratio: 16 / 9; background: transparent; border: 0">
          <svg viewBox="0 0 960 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Day-ahead baseload power prices over thirty days for Finland, Sweden SE3 and Lithuania">
            <path d="{{chart.gridPath}}" fill="none" stroke="rgba(246,243,238,0.10)" stroke-width="1"></path>
            <text x="60" y="{{chart.g0.ty}}" text-anchor="end" fill="#6d6861" font-family="IBM Plex Mono, monospace" font-size="19">{{chart.g0.label}}</text>
            <text x="60" y="{{chart.g1.ty}}" text-anchor="end" fill="#6d6861" font-family="IBM Plex Mono, monospace" font-size="19">{{chart.g1.label}}</text>
            <text x="60" y="{{chart.g2.ty}}" text-anchor="end" fill="#6d6861" font-family="IBM Plex Mono, monospace" font-size="19">{{chart.g2.label}}</text>
            <text x="60" y="{{chart.g3.ty}}" text-anchor="end" fill="#6d6861" font-family="IBM Plex Mono, monospace" font-size="19">{{chart.g3.label}}</text>
            <text x="60" y="{{chart.g4.ty}}" text-anchor="end" fill="#6d6861" font-family="IBM Plex Mono, monospace" font-size="19">{{chart.g4.label}}</text>
            <line x1="68" x2="880" y1="372" y2="372" stroke="rgba(246,243,238,0.22)" stroke-width="1"></line>
            <text x="{{chart.t0.x}}" y="408" text-anchor="middle" fill="#6d6861" font-family="IBM Plex Mono, monospace" font-size="19">{{chart.t0.label}}</text>
            <text x="{{chart.t1.x}}" y="408" text-anchor="middle" fill="#6d6861" font-family="IBM Plex Mono, monospace" font-size="19">{{chart.t1.label}}</text>
            <text x="{{chart.t2.x}}" y="408" text-anchor="middle" fill="#6d6861" font-family="IBM Plex Mono, monospace" font-size="19">{{chart.t2.label}}</text>
            <text x="{{chart.t3.x}}" y="408" text-anchor="middle" fill="#6d6861" font-family="IBM Plex Mono, monospace" font-size="19">{{chart.t3.label}}</text>
            <text x="{{chart.t4.x}}" y="408" text-anchor="middle" fill="#6d6861" font-family="IBM Plex Mono, monospace" font-size="19">{{chart.t4.label}}</text>
            <path d="{{chart.s0.d}}" fill="none" stroke="{{chart.s0.color}}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"></path>
            <path d="{{chart.s1.d}}" fill="none" stroke="{{chart.s1.color}}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"></path>
            <path d="{{chart.s2.d}}" fill="none" stroke="{{chart.s2.color}}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"></path>
            <text x="890" y="{{chart.s0.ly}}" fill="{{chart.s0.color}}" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="500">{{chart.s0.label}}</text>
            <text x="890" y="{{chart.s1.ly}}" fill="{{chart.s1.color}}" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="500">{{chart.s1.label}}</text>
            <text x="890" y="{{chart.s2.ly}}" fill="{{chart.s2.color}}" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="500">{{chart.s2.label}}</text>
          </svg>
        </figure>
        </div>

        <p style="font-size: 12px; line-height: 1.5; color: #6d6861">
          Sample series, drawn from <span class="ed-num">SAMPLE_PRICES</span> in this artboard&#39;s logic block &mdash; illustrative of the
          FI&ndash;LT spread, not a quotation. Replace it with the live series, or fill the
          <span class="ed-num">prices-chart</span> slot with the data app&#39;s embed.
        </p>
      </div>

      <!-- Panel: cross-border flows -------------------------------------- -->
      <div class="ed-panel" style="display: flex; flex-direction: column; gap: 16px; padding: 24px; background: #0d0b09; border: 1px solid rgba(246,243,238,0.14); border-radius: 3px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h3 style="font-size: 18px">The Nordic&ndash;Baltic corridor</h3>
          <p style="font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: #6d6861">Schematic &middot; net flow, share of capacity</p>
        </div>

        <figure class="ed-slot" data-slot="flows-map" data-kind="map" data-ratio="4/3" data-min-width="1400" style="aspect-ratio: 4 / 3; background: transparent; border: 0">
          <svg viewBox="0 0 640 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Schematic map of net cross-border electricity flows across the Nordic and Baltic bidding zones">
            <defs>
              <marker id="ed-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14"
                      markerUnits="userSpaceOnUse" orient="auto-start-reverse">
                <path d="M0 1 L9 5 L0 9 z" fill="#e7963d"></path>
              </marker>
            </defs>

        dek: 'Solar passed 3 GW in March. Wind and solar together already cover 68% of demand. Another 4 GW of solar holds technical permits. The binding constraint has quietly moved from megawatts to euros per megawatt-hour.',
        byline: 'Boreal Grid Research', published: '2026-09-16', readingTime: '9 min read', href: '#renewables' }
    ];

  /* --- helpers ----------------------------------------------------------- */

  /* Props arrive as JSON strings so the canvas can carry structured content in
     a plain text tweak. A malformed string falls back to the default rather
     than blanking the section — a half-rendered page is harder to debug than
     a page that quietly shows its defaults and logs why. */
  parseProp(raw, fallback) {
    const text = (raw ?? '').trim();
    if (!text) return fallback;
    try {
      const parsed = JSON.parse(text);
      return (parsed === null || parsed === undefined) ? fallback : parsed;
    } catch (e) {
      console.warn('[artboard] prop is not valid JSON, using the default:', e.message);
      return fallback;
    }
  }

  formatDate(iso) {
    const t = Date.parse(iso);
    if (isNaN(t)) return String(iso);
    const d = new Date(t);
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return d.getUTCDate() + ' ' + months[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
  }

  /* -----------------------------------------------------------------------
     Chart and map geometry.

     Both emit numbered keys (chart.s0, map.n3, ...) rather than arrays, because
     the markup inside <svg> is written out element by element: a template tag
     such as <sc-for> inside an <svg> is parsed into the SVG namespace, where it
     is not a control-flow element. Keeping the SVG free of custom elements is
     what makes these panels render the same way in the canvas, in the standalone
     preview and in a PNG/PDF export.

     The counts are therefore fixed by the markup: 3 series, 5 gridlines,
     5 x-axis ticks, 7 nodes, 8 links. Add a series and you add its two SVG
     elements too.
     ----------------------------------------------------------------------- */

  buildChart() {
    const series = Component.SAMPLE_PRICES;
    const L = 68, R = 880, T = 26, B = 372;    // plot box inside the 960x420 viewBox
    const lo = 0, hi = 140, step = 35;         // rounded axis bounds around the data
    const n = series[0].values.length;

    const px = (i) => L + (R - L) * (i / (n - 1));
    const py = (v) => B - (B - T) * ((v - lo) / (hi - lo));

    const out = {};

    // One path for every gridline keeps the background to a single element.
    const grid = [];
    let g = 0;
    for (let v = lo; v <= hi; v += step) {
      const y = py(v);
      grid.push('M' + L + ' ' + y.toFixed(1) + 'H' + R);
      out['g' + g] = { ty: (y + 4).toFixed(1), label: String(v) };
      g += 1;
    }
    out.gridPath = grid.join(' ');

    const tickAt = [0, 7, 14, 21, n - 1];
    for (let t = 0; t < tickAt.length; t += 1) {
      const i = tickAt[t];
      out['t' + t] = {
        x: px(i).toFixed(1),
        label: i === n - 1 ? 'today' : 'D-' + (n - 1 - i)
      };
    }

    // Nudge the right-hand labels apart so two close series never collide.
    const ends = series
      .map((sr, i) => ({ i, y: py(sr.values[n - 1]) }))
      .sort((a, b) => a.y - b.y);
    const labelY = [];
    let last = -Infinity;
    for (const e of ends) {
      const y = Math.max(e.y, last + 23);
      labelY[e.i] = y;
      last = y;
    }

    for (let i = 0; i < series.length; i += 1) {
      out['s' + i] = {
        label: series[i].label,
        color: series[i].color,
        d: series[i].values
          .map((v, j) => (j ? 'L' : 'M') + px(j).toFixed(1) + ' ' + py(v).toFixed(1))
          .join(' '),
        ly: (labelY[i] + 7).toFixed(1)
      };
    }

    return out;
  }

  buildMap() {
    const { nodes, links } = Component.SAMPLE_FLOWS;
    const at = {};
    for (const nd of nodes) at[nd.code] = nd;

    const out = {};

    for (let i = 0; i < nodes.length; i += 1) {
      out['n' + i] = { code: nodes[i].code, x: nodes[i].x, y: nodes[i].y, ty: nodes[i].y + 8 };
    }

    for (let i = 0; i < links.length; i += 1) {
      const l = links[i];
      const a = at[l.from], b = at[l.to];
      // Pull both ends back to the node rim so the arrowhead sits clear of it.
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const r = 34;
      out['l' + i] = {
        x1: (a.x + (dx / len) * r).toFixed(1),
        y1: (a.y + (dy / len) * r).toFixed(1),
        x2: (b.x - (dx / len) * r).toFixed(1),
        y2: (b.y - (dy / len) * r).toFixed(1),
        width: (2 + l.share * 7).toFixed(2),
        color: l.share >= 0.6 ? '#e7963d' : '#7d6a52'
      };
    }

    return out;
  }

  /* --- render ------------------------------------------------------------ */

  renderVals() {
    const url = (this.props.liveDataUrl ?? '').trim();
    const wired = url.length > 0;

    const nlCfg = this.parseProp(this.props.newsletterJson, Component.DEFAULT_NEWSLETTER);
    const nlDefaults = Component.DEFAULT_NEWSLETTER;
    const nl = Object.assign({}, nlDefaults, nlCfg);
    const nlWired = String(nl.action ?? '').trim().length > 0;

    const tiers = this.parseProp(this.props.tiersJson, Component.DEFAULT_TIERS);
    const stories = this.parseProp(this.props.storiesJson, Component.DEFAULT_STORIES);
    const rail = this.parseProp(this.props.railJson, Component.SAMPLE_RAIL);

    const story = (i) => {
      const s = stories[i] || Component.DEFAULT_STORIES[i] || {};
      return {
        kicker: s.kicker ?? '',
        title: s.title ?? '',
        dek: s.dek ?? '',
        byline: s.byline ?? '',
        dateLabel: this.formatDate(s.published),
        readingTime: s.readingTime ?? '',
        href: s.href ?? '#analysis'
      };
    };

    const symbol = { EUR: '€', USD: '$', GBP: '£' };

    return {
      accent: this.props.accent ?? '#e7963d',
      density: this.props.density ?? 'editorial',
      showMarketRail: this.props.showMarketRail ?? true,

      brandName: this.props.brandName ?? 'Boreal Grid',
      brandTagline: this.props.brandTagline ?? 'Nordic and Baltic power markets, decomposed.',
      brandContact: this.props.brandContact ?? '[CONTACT EMAIL]',
      year: new Date().getFullYear(),

      lead: story(0),
      second: story(1),

      nl: {
        name: nl.name,
        headline: nl.headline,
        bandHeadline: nl.bandHeadline,
        promise: nl.promise,
        cadence: nl.cadence,
        reassurance: nl.reassurance,
        submitLabel: nl.submitLabel,
        bullets: Array.isArray(nl.bullets) ? nl.bullets : nlDefaults.bullets,
        action: nl.action,
        method: nl.method || 'post',
        field: nl.field || 'email',
        wired: nlWired,
        unwired: !nlWired,
        warning: 'Not connected — set newsletter.formAction in app.config.json. The field above stays inert until you do, so no address is taken and dropped.'
      },

      tiers: (Array.isArray(tiers) ? tiers : Component.DEFAULT_TIERS).map((t) => {
        const priced = String(t.price ?? '').trim().length > 0;
        const buyable = String(t.checkoutUrl ?? '').trim().length > 0;
        const cur = symbol[t.currency] || t.currency || '€';
        return {
          name: t.name,
          kind: t.kind,
          summary: t.summary,
          features: Array.isArray(t.features) ? t.features : [],
          unit: t.unit ?? '',
          amount: priced ? cur + t.price : 'Price on request',
          amountClass: priced ? '' : 'ed-tier__amount--tbc',
          featuredClass: t.featured ? 'ed-tier--featured' : '',
          chipClass: t.featured ? 'ed-chip--accent' : '',
          href: buyable ? t.checkoutUrl : '#subscribe',
          cta: buyable ? (t.cta ?? 'Buy') : 'Join the waitlist',
          ctaClass: t.featured && buyable ? '' : 'ed-cta--ghost',
          note: buyable
            ? 'Secure checkout. Invoice on request.'
            : 'Not on sale yet — this button subscribes you to the newsletter, and you hear first.',
          noteColor: buyable ? '#6d6861' : '#e7963d'
        };
      }),

      liveDataHref: wired ? url : '#subscribe',
      liveDataLabel: wired ? (this.props.liveDataLabel ?? 'Open the live data app') : 'Get told when it opens',

      feed: wired
        ? { label: 'Live', chipClass: 'ed-chip--live', ctaClass: '', hint: url, hintColor: '#6d6861' }
        : { label: 'Sample feed', chipClass: '', ctaClass: 'ed-cta--ghost', hint: '[SET liveDataUrl TO YOUR LIVE DATA APP]', hintColor: '#e7963d' },

      rail: (Array.isArray(rail) ? rail : Component.SAMPLE_RAIL).map((r) => ({
        code: r.code,
        value: r.value,
        change: (Number(r.change) > 0 ? '+' : '') + Number(r.change).toFixed(2) + '%',
        color: Number(r.change) > 0 ? '#3fbf7f' : Number(r.change) < 0 ? '#e5644a' : '#97918a'
      })),

      chart: this.buildChart(),
      map: this.buildMap(),

      footer: [
        { title: 'Analysis', links: [
          { label: 'Finland', href: story(0).href },
          { label: 'Lithuania', href: story(1).href },
          { label: 'Markets', href: '#markets' }
        ] },
        { title: 'Research', links: [
          { label: 'Reports', href: '#reports' },
          { label: 'Methodology', href: '#reports' },
          { label: 'Live data app', href: wired ? url : '#live-data-app' }
        ] },
        { title: 'Desk', links: [
          { label: 'Newsletter', href: '#subscribe' },
          { label: 'About', href: '#about' },
          { label: 'Contact', href: '#contact' }
        ] }
      ]
    };
  }
}
</script>
<script>/* ---------------------------------------------------------------------------
   image-slot.js — the media import layer for the Boreal Grid site.

   Every picture, graph, map and video on the page is a declared SLOT. Markup
   reserves the space and names the slot; nothing in the markup knows where the
   asset lives:

     <figure class="ed-slot" data-slot="finland-photo" data-caption="..."></figure>

   To fill a slot, add an entry to assets/manifest.json keyed by the same id.
   Three source shapes are supported, which is what makes one mechanism cover
   pictures, graphs and maps at once:

     { "type": "image", "src": "media/lead.jpg", "alt": "..." }
       any raster or SVG file under assets/

     { "type": "embed", "src": "https://data.example/chart/de-da?embed=1" }
       a live graph or slippy map served by the live-data app; rendered in a
       sandboxed iframe so a third-party embed cannot reach into this page

     { "type": "inline", "svg": "<svg …>…</svg>" }
       a vector export pasted straight in — stays crisp in PNG/PDF export

   An unfilled slot renders a designed placeholder carrying its id, kind and
   the source spec it wants, so an unfinished page still reads as a layout
   rather than as a hole. A slot that already contains drawn content — the
   sample price chart and flow map do — keeps it until the manifest overrides it.

   Plain <script>, no modules, no build step. Works from file:// as well as
   from a server: when fetch() is unavailable or blocked, the page's own
   window.ED_MANIFEST object is used instead.

   Set window.ED_ASSET_BASE before this script to relocate assets/ for a page
   that is not at the site root.
   --------------------------------------------------------------------------- */

(function (global, document) {
  'use strict';

  /* Pages that do not sit at the site root (the article pages under news/)
     set window.ED_ASSET_BASE before loading this file, so a manifest entry
     stays a single repo-relative path no matter which page resolves it. */
  var ASSET_BASE = global.ED_ASSET_BASE || 'assets/';
  var MANIFEST_URL = ASSET_BASE + 'manifest.json';

  var GLYPH = {
    photo: '<path d="M3 5.5h4l1.4-2h7.2L17 5.5h4v13H3z"/><circle cx="12" cy="12" r="3.6"/>',
    chart: '<path d="M4 20V9.5M10 20V4.5M16 20v-7M22 20H2"/>',
    map:   '<path d="M9 3.5 3 6v14.5l6-2.5 6 2.5 6-2.5V3.5L15 6z"/><path d="M9 3.5V18M15 6v14.5"/>',
    video: '<rect x="2.5" y="5" width="14" height="14" rx="1.5"/><path d="M16.5 10.5 21.5 7.5v9l-5-3z"/>',
    logo:  '<rect x="2.5" y="7" width="19" height="10" rx="1.5"/><path d="M6.5 12h11"/>'
  };

  function svgGlyph(kind) {
    var d = GLYPH[kind] || GLYPH.photo;
    return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="1.25" stroke-linecap="round" ' +
      'stroke-linejoin="round" aria-hidden="true" focusable="false">' + d + '</svg>';
  }

  function escapeHtml(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function specOf(el, spec) {
    return {
      id: el.getAttribute('data-slot') || '',
      kind: el.getAttribute('data-kind') || (spec && spec.kind) || 'photo',
      ratio: el.getAttribute('data-ratio') || (spec && spec.ratio) || '16/9',
      minW: Number(el.getAttribute('data-min-width') || (spec && spec.minW) || 0),
      caption: el.getAttribute('data-caption') || ''
    };
  }

  function renderEmpty(el, s) {
    el.classList.add('ed-slot--empty');
    el.setAttribute('data-state', 'empty');
    el.innerHTML =
      '<span style="color:' + (s.kind === 'chart' || s.kind === 'map' ? '#00c7a6' : '#97918a') + '">' +
        svgGlyph(s.kind) +
      '</span>' +
      '<span class="ed-slot__id">' + escapeHtml(s.id) + '</span>' +
      '<span class="ed-slot__spec">' + escapeHtml(s.kind) + ' &middot; ' +
        escapeHtml(s.ratio.replace('/', ':')) +
        (s.minW ? ' &middot; ' + s.minW + 'px min' : '') +
      '</span>';
  }

  function renderFilled(el, s, entry) {
    el.classList.remove('ed-slot--empty');
    el.setAttribute('data-state', 'filled');

    if (entry.type === 'inline' && entry.svg) {
      el.innerHTML = entry.svg;
      return;
    }

    var src = entry.src || '';
    if (!src) { renderEmpty(el, s); return; }

    if (entry.type === 'embed') {
      // Sandboxed: a live chart or map embed gets to run scripts, nothing else.
      el.innerHTML = '<iframe src="' + escapeHtml(src) + '" loading="lazy" ' +
        'title="' + escapeHtml(entry.alt || s.id) + '" ' +
        'sandbox="allow-scripts allow-popups" referrerpolicy="no-referrer"></iframe>';
      return;
    }

    if (entry.type === 'video') {
      el.innerHTML = '<video src="' + escapeHtml(resolve(src)) + '" playsinline muted ' +
        (entry.poster ? 'poster="' + escapeHtml(resolve(entry.poster)) + '" ' : '') +
        'controls></video>';
      return;
    }

    el.innerHTML = '<img src="' + escapeHtml(resolve(src)) + '" ' +
      'alt="' + escapeHtml(entry.alt || '') + '" loading="lazy" decoding="async">';
  }

  function resolve(src) {
    return /^(https?:|data:|blob:|\/)/.test(src) ? src : ASSET_BASE + src;
  }

  function apply(manifest) {
    var assets = (manifest && manifest.assets) || {};
    var nodes = document.querySelectorAll('[data-slot]');
    var filled = 0;

    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var declared = global.EDS ? global.EDS.slot(el.getAttribute('data-slot')) : null;
      var s = specOf(el, declared);

      if (s.ratio && !el.style.aspectRatio) el.style.aspectRatio = s.ratio;

      var entry = assets[s.id];
      if (entry && (entry.src || entry.svg)) {
        renderFilled(el, s, entry);
        filled++;
      } else if (el.querySelector('svg, img, iframe, video')) {
        // The slot ships with drawn content (the sample chart and map do).
        // That is its default, not a hole — leave it until the manifest fills it.
        el.setAttribute('data-state', 'default');
      } else {
        renderEmpty(el, s);
      }

      if (s.caption) {
        var cap = document.createElement('figcaption');
        cap.className = 'ed-slot__caption';
        cap.textContent = s.caption;
        if (el.parentNode) el.parentNode.insertBefore(cap, el.nextSibling);
      }
    }

    document.documentElement.setAttribute('data-slots-filled', filled + '/' + nodes.length);
    global.dispatchEvent(new CustomEvent('ed:slots-ready', {
      detail: { total: nodes.length, filled: filled }
    }));
  }

  function load() {
    // An inline manifest always wins — it is what makes file:// previews work.
    if (global.ED_MANIFEST) { apply(global.ED_MANIFEST); return; }
    if (typeof fetch !== 'function') { apply(null); return; }
    fetch(MANIFEST_URL, { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(apply)
      .catch(function () { apply(null); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', load);
  else load();

  global.EDSlots = { apply: apply, reload: load };
})(typeof window !== 'undefined' ? window : globalThis, document);
</script>
